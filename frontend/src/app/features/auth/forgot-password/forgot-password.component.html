<div class="forgot-container">
  <div class="forgot-card">

    <!-- Header Logo -->
    <div class="card-header">
      <div class="logo-block">
        <img src="assets/images/easybulk-logo.png" 
             alt="EasyBulk" 
             class="logo-img">
        <span class="logo-text">EasyBulk</span>
      </div>
    </div>

    <!-- Titre -->
    <h1 class="card-title">Réinitialiser votre mot de passe</h1>
    <p class="card-subtitle">
      Veuillez saisir votre adresse e-mail.<br>
      Un lien de réinitialisation vous sera envoyé.
    </p>

    <!-- Formulaire -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="field-group">
        <label>Email</label>
        <input 
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          required
        >
      </div>

      <button 
        type="submit"
        [disabled]="isLoading"
        class="btn-send">
        <span *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full inline-block mr-2"></span>
        {{ isLoading ? 'Envoi en cours...' : 'Envoyer' }}
      </button>
    </form>

    <!-- Messages -->
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Lien retour -->
    <a routerLink="/auth/login" class="back-link">
      ← Retour à la connexion
    </a>

  </div>
</div>
