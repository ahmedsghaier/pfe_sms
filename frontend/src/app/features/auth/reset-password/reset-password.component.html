<div class="auth-container">
  <div class="auth-background">
    <div class="envelope envelope-1"></div>
    <div class="envelope envelope-2"></div>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <img src="assets/images/easybulk-logo.svg" alt="EasyBulk">
      </div>
      <h1>Réinitialiser le mot de passe</h1>
    </div>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">Nouveau mot de passe</label>
        <div class="password-input-wrapper">
          <input
            id="newPassword"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="newPassword"
            [class.invalid]="newPassword?.invalid && newPassword?.touched"
          >
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility('password')"
            tabindex="-1"
          >
            <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20C17 20 21.27 16.89 23 12.5C21.27 8.11 17 5 12 5Z" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
            <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M3 3L21 21M10.5 10.5C9.5 11.5 9.5 13 10.5 14C11.5 15 13 15 14 14M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20C17 20 21.27 16.89 23 12.5" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <div class="error-message" *ngIf="newPassword?.invalid && newPassword?.touched">
          <span *ngIf="newPassword?.errors?.['required']">Le mot de passe est requis</span>
          <span *ngIf="newPassword?.errors?.['minlength']">Minimum 8 caractères</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <div class="password-input-wrapper">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            [class.invalid]="confirmPassword?.invalid && confirmPassword?.touched"
          >
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility('confirm')"
            tabindex="-1"
          >
            <svg *ngIf="!showConfirmPassword" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20C17 20 21.27 16.89 23 12.5C21.27 8.11 17 5 12 5Z" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
            <svg *ngIf="showConfirmPassword" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M3 3L21 21M10.5 10.5C9.5 11.5 9.5 13 10.5 14C11.5 15 13 15 14 14M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20C17 20 21.27 16.89 23 12.5" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <div class="error-message" *ngIf="confirmPassword?.invalid && confirmPassword?.touched">
          <span *ngIf="confirmPassword?.errors?.['required']">Veuillez confirmer le mot de passe</span>
          <span *ngIf="confirmPassword?.errors?.['mismatch']">Les mots de passe ne correspondent pas</span>
        </div>
      </div>

      <div class="alert alert-error" *ngIf="error">
        {{ error }}
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-block"
        [disabled]="loading || resetPasswordForm.invalid"
      >
        <span *ngIf="!loading">Envoyer</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>
  </div>
</div>
