version: '3.8'

services:
  # ========================================
  # BASE DE DONNÉES
  # ========================================
  mongodb:
    image: mongo:7.0
    container_name: easybulk-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d
    networks:
      - easybulk-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USERNAME}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ========================================
  # REDIS (NOUVEAU - pour le cache AI)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: easybulk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - easybulk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  # ========================================
  # MICROSERVICES
  # ========================================

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: easybulk-auth-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/easybulk_auth?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms128m -Xmx256m"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - easybulk-network
    deploy:
      resources:
        limits:
          memory: 512m

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: easybulk-user-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/easybulk_users?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms128m -Xmx256m"
      AI_TIMING_SERVICE_URL: http://host.docker.internal:8086
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - easybulk-network
    deploy:
      resources:
        limits:
          memory: 512m

  campaign-service:
    build:
      context: ./backend
      dockerfile: campaign-service/Dockerfile
    container_name: easybulk-campaign-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/easybulk_campaigns?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms128m -Xmx256m"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - easybulk-network
    deploy:
      resources:
        limits:
          memory: 512m

  contact-service:
    build:
      context: ./backend
      dockerfile: contact-service/Dockerfile
    container_name: easybulk-contact-service
    restart: unless-stopped
    ports:
      - "8084:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/easybulk_contacts?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms128m -Xmx256m"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - easybulk-network
    deploy:
      resources:
        limits:
          memory: 512m

  sms-gateway-service:
    build:
      context: ./backend
      dockerfile: sms-gateway-service/Dockerfile
    container_name: easybulk-sms-gateway-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/easybulk_sms?authSource=admin
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms128m -Xmx256m"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - easybulk-network
    deploy:
      resources:
        limits:
          memory: 512m

  # ========================================
  # AI TIMING SERVICE (NOUVEAU)
  # ========================================
  ai-timing-service:
    build:
      context: ./backend/ai-timing-service
      dockerfile: Dockerfile
    container_name: easybulk-ai-timing-service
    restart: unless-stopped
    ports:
      - "8086:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_PATH: /usr/bin/python3
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - ./backend/ai-timing-service/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - easybulk-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2048m  # Plus de mémoire pour Python + ML
        reservations:
          memory: 1024m

  # ========================================
  # API GATEWAY
  # ========================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: easybulk-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms128m -Xmx256m"
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      campaign-service:
        condition: service_started
      contact-service:
        condition: service_started
      sms-gateway-service:
        condition: service_started
      ai-timing-service:  # 🆕 Ajouter la dépendance
        condition: service_healthy
    networks:
      - easybulk-network
    deploy:
      resources:
        limits:
          memory: 512m

  # ========================================
  # FRONTEND
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easybulk-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - easybulk-network
    deploy:
      resources:
        limits:
          memory: 256m

# ========================================
# NETWORK & VOLUMES
# ========================================
networks:
  easybulk-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:  # 🆕 NOUVEAU VOLUME
    driver: local