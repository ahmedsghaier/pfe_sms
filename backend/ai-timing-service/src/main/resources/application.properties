# ========================================
# APPLICATION
# ========================================
spring.application.name=ai-timing-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ========================================
# SERVER
# ========================================
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ========================================
# REDIS
# ========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000ms

spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms

# ========================================
# AI TIMING - MODELS
# ========================================
ai-timing.models.base-path=/app/models/
ai-timing.models.ensemble-model=ensemble_phase2_v13.pkl
ai-timing.models.time-score-matrix=time_score_matrix_v13.pkl
ai-timing.models.selected-features=selected_features_v13.pkl

# ========================================
# AI TIMING - PYTHON
# ========================================
ai-timing.python.executable=${PYTHON_PATH:/usr/bin/python3}
ai-timing.python.script-path=/app/python/prediction_engine.py
ai-timing.python.timeout=30000
ai-timing.python.pool-size=5

# ========================================
# AI TIMING - PREDICTION
# ========================================
ai-timing.prediction.cache-enabled=true
ai-timing.prediction.cache-ttl=3600000
ai-timing.prediction.batch-size=100

# ========================================
# AI TIMING - TIMING PARAMETERS
# ========================================
ai-timing.timing.alpha=0.5
ai-timing.timing.threshold-pct=0.95
ai-timing.timing.min-gap-hours=1
ai-timing.timing.max-gap-hours=4
ai-timing.timing.allowed-hour-start=7
ai-timing.timing.allowed-hour-end=23

# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.com.easybulk.aitiming=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/app/logs/ai-timing-service.log
logging.file.max-size=10MB
logging.file.max-history=7

# ========================================
# ACTUATOR
# ========================================
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.info.env.enabled=true

# ========================================
# INFO ENDPOINT
# ========================================
info.app.name=AI Timing Service
info.app.description=Smart Timing Engine for SMS Campaigns
info.app.version=1.0.0
info.app.model-version=v13

eureka.client.enabled=false
spring.cloud.discovery.enabled=false