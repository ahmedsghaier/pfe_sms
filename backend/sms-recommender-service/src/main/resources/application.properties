# Server
server.port=8087

# Application
spring.application.name=sms-recommender-service

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/easybulk}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Eureka
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Python ML Service
ml.python-service-url=${PYTHON_ML_URL:http://localhost:5000}

# Recommender
recommender.cache-ttl-seconds=300