spring.application.name=api-gateway
server.port=8080

# ===== ROUTES =====

# Route publique ? PAS de filtre auth
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://easybulk-auth-service:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**,/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://easybulk-user-service:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**,/api/users/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[2].id=campaign-service
spring.cloud.gateway.routes[2].uri=http://easybulk-campaign-service:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/campaigns/**,/api/campaigns/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[3].id=contact-service
spring.cloud.gateway.routes[3].uri=http://easybulk-contact-service:8080
spring.cloud.gateway.routes[3].predicates[0]=Path=/contacts/**,/api/contacts/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[4].id=sms-gateway-service
spring.cloud.gateway.routes[4].uri=http://easybulk-sms-gateway-service:8080
spring.cloud.gateway.routes[4].predicates[0]=Path=/sms/**,/api/sms/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[5].id=ai-timing-service
spring.cloud.gateway.routes[5].uri=http://easybulk-ai-timing-service:8080
spring.cloud.gateway.routes[5].predicates[0]=Path=/ai/**,/api/ai/**,/api/v1/timing/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[6].id=template-service
spring.cloud.gateway.routes[6].uri=http://easybulk-campaign-service:8080
spring.cloud.gateway.routes[6].predicates[0]=Path=/templates/**,/api/templates/**
spring.cloud.gateway.routes[6].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[7].id=sms-recommender-service
spring.cloud.gateway.routes[7].uri=http://easybulk-sms-recommender-service:8087
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/sms-recommender/**
spring.cloud.gateway.routes[7].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[8].id=ai-timing-service-model-results
spring.cloud.gateway.routes[8].uri=http://ai-timing-service:8080
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/model-results/**
# ===== CORS =====
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=false

# ===== DEFAULT FILTERS =====
spring.cloud.gateway.default-filters=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

