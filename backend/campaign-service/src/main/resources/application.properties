# ========================================
# Application
# ========================================
spring.application.name=campaign-service

# ========================================
# MongoDB
# ========================================
spring.data.mongodb.uri=mongodb://admin:admin123@mongodb:27017/easybulk_campaigns?authSource=admin
spring.data.mongodb.auto-index-creation=true

# ========================================
# Server
# ========================================
server.port=8080

# ========================================
# URLs des autres services
# ========================================
services.user-service=${USER_SERVICE_URL:http://user-service:8082}
services.contact-service=${CONTACT_SERVICE_URL:http://contact-service:8084}
services.sms-gateway=${SMS_GATEWAY_URL:http://sms-gateway-service:8085}
services.ai.timing.service.url=${AI_TIMING_SERVICE_URL:http://ai-timing-service:8086}

# ========================================
# AI Timing Service
# ========================================
ai.timing.service.url=${AI_TIMING_SERVICE_URL:http://ai-timing-service:8086}

# ========================================
# Feign Client
# ========================================
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=30000
feign.client.config.default.loggerLevel=BASIC

feign.client.config.ai-timing-service.connectTimeout=5000
feign.client.config.ai-timing-service.readTimeout=45000
feign.client.config.ai-timing-service.loggerLevel=FULL

feign.circuitbreaker.enabled=true
feign.circuitbreaker.alphanumeric-ids.enabled=true

feign.compression.request.enabled=true
feign.compression.request.mime-types=application/json

feign.compression.response.enabled=true

# ========================================
# Resilience4j Circuit Breaker
# ========================================
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=30s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.configs.default.recordExceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.configs.default.recordExceptions[1]=java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.configs.default.recordExceptions[2]=java.io.IOException

resilience4j.circuitbreaker.instances.ai-timing-service.baseConfig=default
resilience4j.circuitbreaker.instances.ai-timing-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.ai-timing-service.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.ai-timing-service.failureRateThreshold=60

# ========================================
# Resilience4j Retry
# ========================================
resilience4j.retry.configs.default.maxAttempts=2
resilience4j.retry.configs.default.waitDuration=1000ms
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2

resilience4j.retry.instances.ai-timing-service.baseConfig=default
resilience4j.retry.instances.ai-timing-service.maxAttempts=2
resilience4j.retry.instances.ai-timing-service.waitDuration=2000ms

# ========================================
# TimeLimiter
# ========================================
resilience4j.timelimiter.configs.default.timeoutDuration=30s
resilience4j.timelimiter.instances.ai-timing-service.timeoutDuration=45s

# ========================================
# JWT
# ========================================
jwt:
secret: ${JWT_SECRET:3zf52MgZ/DhJJl8o+tVSs7FN3AVuEYGC0/zx9CvKjdwPlfr91HoTvm9xOk/EhHe1}
expiration: ${JWT_EXPIRATION:86400000}
refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}


# ========================================
# Logging
# ========================================
logging.level.com.easybulk=DEBUG
logging.level.com.easybulk.campaignservice=DEBUG
logging.level.com.easybulk.campaignservice.client=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.feign=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=logs/campaign-service.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ========================================
# Actuator & Monitoring
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.metrics.export.prometheus.enabled=true

# ========================================
# CORS
# ========================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ========================================
# HTTP Client
# ========================================
http.client.connection-timeout=5000
http.client.read-timeout=30000